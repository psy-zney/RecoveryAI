name: CI & Forensic Validation

on:
  push:
    branches: [ main, work ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Rust & Forensic Test Suite (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Workspace
        run: cargo check --workspace --locked

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Unit Tests
        run: cargo test --workspace --locked

      - name: Build Release Engine
        run: cargo build --release --locked

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run End-to-End Forensic Test Suite
        run: python tests/test_e2e_recovery.py

      - name: Run Recovery Workbench Regression Tests
        run: python tests/test_recovery_workbench.py

      - name: Run FAT32 Deleted-Entry Regression Tests
        run: python tests/test_deleted_recovery.py

      - name: Run Three-Case Integration Tests
        run: python tests/test_three_cases.py

      - name: Install GNU ddrescue for synthetic acquisition tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gddrescue

      - name: Run Rescue Acquisition and Transfer Tests
        run: python tests/test_rescue.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify NPX / Node Bridge
        run: |
          node bin/resc-mcp.js --help
          node bin/resc-mcp.js --version

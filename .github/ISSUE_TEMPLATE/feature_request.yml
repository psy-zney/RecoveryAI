name: Feature Request
description: Suggest an idea or new filesystem / carver support for resc
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest a new feature, new file carving signature, or MCP tool enhancement!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a specific forensic recovery scenario?
      description: A clear and concise description of the recovery challenge.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: Detailed explanation of how this should work or what MCP tool should be added.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
